name: DAKboard snapshot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay at busy times)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write   # only used by the keep-alive step
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install headless browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Take screenshot
        env:
          DAKBOARD_URL: ${{ secrets.DAKBOARD_URL }}
        run: python snap.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4

      # GitHub pauses scheduled jobs after 60 days with no commits.
      # This pushes an empty commit every ~50 days so the job never stops.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive"
            git push
          fi
